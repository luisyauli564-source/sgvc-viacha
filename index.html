<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SGVC · Panel de contratos – GAM Viacha</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">SG</span>
    <div>
      <h1>Gestión de Contratos y Control de Vencimientos</h1>
      <p>Gobierno Autónomo Municipal de Viacha</p>
    </div>
  </div>
  <label class="role">Perfil
    <select id="rol">
      <option value="admin">Administrador</option>
      <option value="resp" selected>Responsable de contratos</option>
      <option value="consulta">Consulta</option>
    </select>
  </label>
</header>

<main>
  <section class="kpis" aria-label="Resumen de estados" id="kpis"></section>

  <div id="banner" class="banner" role="alert" hidden></div>

  <div class="layout">
    <section class="panel" aria-labelledby="t-lista">
      <h2 id="t-lista">Contratos</h2>
      <form class="filters" id="filtros" onsubmit="return false">
        <label>Buscar
          <input type="search" id="q" placeholder="N.º de contrato, objeto o contratista">
        </label>
        <label>Estado
          <select id="estado">
            <option value="">Todos</option>
            <option>Vigente</option>
            <option>Próximo a vencer</option>
            <option>Crítico</option>
            <option>Vencido</option>
          </select>
        </label>
        <label>Alerta anticipada
          <select id="umbral">
            <option value="30">30 días</option>
            <option value="45">45 días</option>
            <option value="60" selected>60 días</option>
          </select>
        </label>
        <label>Ordenar por
          <select id="orden">
            <option value="venc">Fecha de vencimiento</option>
            <option value="num">N.º de contrato</option>
          </select>
        </label>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>N.º</th><th>Objeto</th><th>Contratista</th>
              <th>Vence</th><th>Días</th><th>Estado</th><th>Responsable</th><th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <p id="vacio" class="vacio" hidden>No hay contratos con esos filtros.</p>
      </div>
      <p class="nota">Datos de demostración para el prototipo. Los estados se calculan con la fecha actual.</p>
    </section>

    <aside class="panel chat" aria-labelledby="t-chat">
      <h2 id="t-chat">Asistente de consultas</h2>
      <div id="log" class="log" aria-live="polite"></div>
      <div class="sugeridas" id="sugeridas"></div>
      <form id="chatForm" class="chat-form">
        <input id="msg" type="text" autocomplete="off" placeholder="Ej.: ¿Qué contratos vencen pronto?" aria-label="Mensaje">
        <button type="submit">Enviar</button>
      </form>
    </aside>
  </div>
</main>

<dialog id="dlg">
  <h3 id="dlgTitulo"></h3>
  <ul id="dlgLista" class="historial"></ul>
  <button id="dlgCerrar" type="button">Cerrar</button>
</dialog>

<script src="app.js"></script>
</body>
</html>
